<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achievements | Settlem Academy</title>
<style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:40px 20px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:20px;padding:25px;box-shadow:0 12px 35px #101a4312;margin:20px 0}.xp{font-size:42px;font-weight:900;color:#7c3aed}.badge{display:inline-block;margin:8px;padding:12px 16px;border-radius:14px;background:#f1f5ff;font-weight:800}.btn{padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800}</style></head><body><div class="wrap"><a href="student-dashboard.html"><button class="btn">← Dashboard</button></a><h1>🏆 Achievements</h1><div class="card"><div class="xp" id="xp">0 XP</div><div>Your Settlem Academy progress points</div></div><div class="card"><h2>Badges</h2><div id="badges">Loading…</div></div></div><script src="settlem-api.js"></script><script>
async function load(){if(!getToken()){location.href="student-login.html";return}try{await apiCheckAchievements();const d=await apiAchievements();xp.textContent=d.xp+" XP";badges.innerHTML=d.badges.length?d.badges.map(b=>`<span class="badge">🏅 ${esc(b.badge)} · +${b.xp} XP</span>`).join(""):"Complete lessons to unlock badges."}catch(e){badges.textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();
</script></body></html>
