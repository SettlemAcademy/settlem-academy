<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback Manager | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f7f9fc;color:#17213c}.wrap{max-width:1100px;margin:40px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900}.brand img{width:42px;height:42px;object-fit:contain;vertical-align:middle;margin-right:8px}a{color:#2563eb;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:20px;margin-top:18px}.summary{display:flex;gap:14px;flex-wrap:wrap}.stat{padding:15px 18px;border:1px solid #e2e8f0;border-radius:14px;min-width:150px}.stat b{font-size:26px;display:block}.item{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:10px}.muted{color:#64748b}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}select{padding:10px;border:1px solid #cfd8e6;border-radius:10px}.empty{text-align:center;color:#64748b;padding:30px}</style><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><div class="wrap"><div class="top"><div class="brand"><img src="settlem-academy-logo.png" alt="">SETTLEM ACADEMY · FEEDBACK</div><div><a href="admin-dashboard.html">Dashboard</a> · <a href="index.html">Website</a></div></div><div class="card"><h1>Student Feedback</h1><p class="muted">Review course ratings and written feedback submitted by enrolled students.</p><div class="summary"><div class="stat"><b id="count">—</b><span>Total Reviews</span></div><div class="stat"><b id="avg">—</b><span>Average Rating</span></div></div></div><div class="card"><div class="filters"><select id="course"><option value="">All Courses</option><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select></div><div id="list"><div class="empty">Loading…</div></div></div></div><script src="settlem-api.js?v=20260913"></script><script>let all=[];async function init(){if(!SettlemAPI.hasSession()){location.href='admin-login.html';return}try{const me=await SettlemAPI.request('/me');if(me.role!=='admin')throw new Error('Admin access required');all=await SettlemAPI.request('/admin/feedback');render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">'+safe(e.message||'Unable to load feedback.')+'</div>'}}function render(){const rows=all.filter(x=>!course.value||x.course===course.value);count.textContent=rows.length;avg.textContent=rows.length?(rows.reduce((s,x)=>s+Number(x.rating),0)/rows.length).toFixed(2):'—';list.innerHTML=rows.length?rows.map(x=>`<div class="item"><strong>${safe(x.name)}</strong> <span class="muted">${safe(x.email)}</span><div style="margin-top:6px"><b>${safe(x.course)}</b> · ${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div><p>${safe(x.message)}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'<div class="empty">No feedback found.</div>'}function safe(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}course.onchange=render;init();</script></body></html>
