<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login | Settlem Academy</title>

<style>
:root{
--navy:#101a43;
--blue:#2563eb;
--violet:#7c3aed;
--ink:#172033;
--muted:#64748b;
--line:#e6eaf2
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Segoe UI,Arial,sans-serif;
background:linear-gradient(135deg,#eef4ff,#f8f5ff 55%,#effcf9);
color:var(--ink);
min-height:100vh;
display:grid;
place-items:center;
padding:24px
}

.card{
width:min(460px,100%);
background:#fff;
border:1px solid var(--line);
border-radius:24px;
box-shadow:0 24px 70px rgba(16,26,67,.14);
padding:34px
}

.brand{
display:flex;
align-items:center;
gap:12px;
margin-bottom:28px
}

.brand-logo{
width:52px;
height:52px;
object-fit:contain;
border-radius:14px;
background:#fff;
border:1px solid var(--line)
}

.brand b{
font-size:18px;
color:var(--navy)
}

.brand span{
display:block;
font-size:12px;
color:var(--muted);
margin-top:3px
}

h1{
margin:0 0 8px;
font-size:30px;
color:var(--navy)
}

.sub{
margin:0 0 26px;
color:var(--muted);
line-height:1.6
}

label{
display:block;
font-size:13px;
font-weight:800;
margin:16px 0 7px
}

input{
width:100%;
padding:13px 14px;
border:1px solid #d8deea;
border-radius:12px;
font-size:15px;
outline:none
}

input:focus{
border-color:var(--blue);
box-shadow:0 0 0 4px rgba(37,99,235,.1)
}

button{
width:100%;
margin-top:22px;
padding:14px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,var(--blue),var(--violet));
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer
}

button:disabled{
opacity:.7;
cursor:not-allowed
}

.msg{
min-height:20px;
margin-top:15px;
font-size:13px;
text-align:center
}

.back{
text-align:center;
margin-top:20px;
font-size:13px
}

.back a{
color:var(--blue);
text-decoration:none;
font-weight:700
}

.note{
margin-top:24px;
padding:12px 14px;
background:#f8fafc;
border:1px solid var(--line);
border-radius:12px;
font-size:12px;
color:var(--muted);
line-height:1.55
}
</style>
</head>

<body>

<main class="card">

<div class="brand">
<img class="brand-logo"
src="settlem-academy-logo.png"
alt="Settlem Academy logo">

<div>
<b>SETTLEM ACADEMY</b>
<span>Administration Portal</span>
</div>
</div>

<h1>Admin Sign In</h1>

<p class="sub">
Manage students, lessons, study materials and practice tests
from one secure dashboard.
</p>

<form id="loginForm">

<label>Admin Email</label>

<input
id="email"
type="email"
autocomplete="username"
required
placeholder="admin@example.com">

<label>Password</label>

<input
id="password"
type="password"
autocomplete="current-password"
required
placeholder="Enter your password">

<button id="submitBtn" type="submit">
Sign In to Admin
</button>

<div id="msg" class="msg"></div>

</form>

<div class="back">
<a href="index.html">← Back to website</a>
</div>

<div class="note">
Admin access is enforced by the backend role.
Use HTTPS and strong secret management in production.
</div>

</main>

<script>
const API_URL = "https://settlem-academy-1.onrender.com/api";

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const button = document.getElementById("submitBtn");
    const message = document.getElementById("msg");

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const password =
        document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Signing in…";
    message.textContent = "";
    message.style.color = "#b42318";

    try {

        const response = await fetch(API_URL + "/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        let data = {};

        try {
            data = await response.json();
        } catch (error) {
            throw new Error("The server returned an invalid response.");
        }

        if (!response.ok) {
            throw new Error(
                data.error || "Invalid email or password."
            );
        }

        if (!data.token || !data.user) {
            throw new Error("Login response is incomplete.");
        }

        if (data.user.role !== "admin") {
            throw new Error(
                "This account does not have administrator access."
            );
        }

        localStorage.setItem(
            "settlemAuthToken",
            data.token
        );

        localStorage.setItem(
            "settlemAcademyUser",
            JSON.stringify(data.user)
        );

        message.style.color = "#047857";
        message.textContent = "Login successful. Opening admin dashboard…";

        setTimeout(function(){
            window.location.href = "admin-dashboard.html";
        }, 300);

    } catch(error) {

        message.textContent =
            error.message || "Unable to sign in.";

    } finally {

        button.disabled = false;
        button.textContent = "Sign In to Admin";

    }

});
</script>

</body>
</html>
