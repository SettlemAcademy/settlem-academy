<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Inbox | Settlem Academy</title><style>
:root{--navy:#101a43;--blue:#2563eb;--violet:#7c3aed;--bg:#f6f8fc;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:var(--bg);color:#18213d}.top{background:var(--navy);color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:30px 20px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap}.muted{color:var(--muted);font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:800}.filter.active{background:#eef2ff;color:var(--blue)}.list{display:grid;gap:14px;margin-top:20px}.ticket{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 7px 24px #101a4308}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{padding:6px 9px;border-radius:99px;font-size:11px;font-weight:900}.open{background:#eef2ff;color:var(--blue)}.in_progress{background:#fff5dc;color:#a16207}.resolved{background:#e8f8f3;color:#087f68}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.secondary{background:#eef2ff;color:var(--blue)}textarea{width:100%;min-height:80px;margin-top:8px;padding:10px;border:1px solid #d7deea;border-radius:10px;font:inherit}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:15px}
</style><script src="settlem-api.js?v=20260913"></script><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><header class="top"><strong>SETTLEM ACADEMY · SUPPORT INBOX</strong><a href="admin-dashboard.html">← Admin Dashboard</a></header><main class="wrap"><div class="head"><div><div style="font-size:12px;color:var(--blue);font-weight:900;letter-spacing:.12em;text-transform:uppercase">Admin Support</div><h1 style="margin:7px 0">Student Help Requests</h1><p class="muted">Review questions and move requests through Open → In Progress → Resolved.</p></div><div class="filters"><button class="filter active" data-status="">All</button><button class="filter" data-status="open">Open</button><button class="filter" data-status="in_progress">In Progress</button><button class="filter" data-status="resolved">Resolved</button></div></div><div id="list" class="list"><div class="empty">Loading…</div></div></main><script>
let current='';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){return new Date(s).toLocaleString()}async function load(){const box=document.getElementById('list');try{if(!SettlemAPI.hasSession())return location.href='admin-login.html';const me=await SettlemAPI.request('/me');if(me.role!=='admin')throw Error('Admin access required');const rows=await SettlemAPI.request('/admin/support'+(current?'?status='+encodeURIComponent(current):''));box.innerHTML=rows.length?rows.map(t=>`<article class="ticket"><div class="topline"><div><strong>#${t.id} · ${esc(t.subject)}</strong><div class="muted" style="margin-top:5px">${esc(t.name)} · ${esc(t.email)} · ${fmt(t.created_at)}</div></div><span class="badge ${t.status}">${t.status.replace('_',' ')}</span></div><div class="muted" style="margin-top:10px">${esc(t.category)}${t.course?' · '+esc(t.course):''}</div><p style="line-height:1.6">${esc(t.message)}</p><label class="muted">Admin response / note</label><textarea id="note-${t.id}" placeholder="Optional response to the student">${esc(t.admin_note)}</textarea><div class="actions"><button class="secondary" onclick="update(${t.id},'open')">Open</button><button class="secondary" onclick="update(${t.id},'in_progress')">In Progress</button><button class="primary" onclick="update(${t.id},'resolved')">Resolve & Save</button></div></article>`).join(''):'<div class="empty">No support requests in this view.</div>'}catch(e){if(/Authentication|Admin access|expired/i.test(e.message))location.href='admin-login.html';else box.innerHTML='<div class="empty">Unable to load support inbox.</div>'}}async function update(id,status){try{await SettlemAPI.request('/admin/support/'+id,{method:'PATCH',body:JSON.stringify({status,admin_note:document.getElementById('note-'+id).value})});load()}catch(e){alert(e.message||'Unable to update request')}}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.status;load()});load();
</script></body></html>
