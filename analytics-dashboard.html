<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics | Settlem Academy</title><style>body{font-family:Arial;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:22px}.num{font-size:36px;font-weight:900;color:#2563eb}</style></head><body><div class="wrap"><h1>📈 Academy Analytics</h1><div class="grid"><div class="card"><div class="num" id="s">—</div>Students</div><div class="card"><div class="num" id="e">—</div>Enrollments</div><div class="card"><div class="num" id="a">—</div>Classes Attended</div><div class="card"><div class="num" id="l">—</div>Lessons Completed</div><div class="card"><div class="num" id="t">—</div>Tests Taken</div><div class="card"><div class="num" id="avg">—</div>Average Test Score</div></div></div><script src="settlem-api.js"></script><script>async function load(){if(!getToken()){location.href="student-login.html";return}try{const me=await apiMe();if(!["admin","teacher"].includes(me.role))throw new Error("Teacher/Admin access required");const d=await apiAdminAnalytics();s.textContent=d.students;e.textContent=d.enrollments;a.textContent=d.classes_attended;l.textContent=d.lessons_completed;t.textContent=d.tests_taken;avg.textContent=d.average_test_score+"%"}catch(e){document.body.insertAdjacentHTML("beforeend","<p style='padding:20px'>"+e.message+"</p>")}}load();</script></body></html>
