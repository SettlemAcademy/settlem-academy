<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcement Manager | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:950px;margin:auto;padding:35px 20px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:22px;margin:14px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #dbe2ed;border-radius:10px}button{padding:11px 15px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.del{background:#dc2626;float:right}.item{padding:14px 0;border-bottom:1px solid #e8edf4}</style></head><body><div class="wrap"><h1>📣 Announcement Manager</h1><div class="card"><input id="title" placeholder="Announcement title"><select id="course"><option value="">All Students</option><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select><textarea id="message" rows="5" placeholder="Write your announcement..."></textarea><button onclick="create()">Publish Announcement</button><p id="msg"></p></div><div class="card"><h2>Published</h2><div id="list">Loading…</div></div></div><script src="settlem-api.js"></script><script>async function load(){try{const me=await apiMe();if(!['admin','teacher'].includes(me.role))throw new Error('Teacher/Admin access required');const d=await apiAnnouncements();list.innerHTML=d.map(a=>`<div class="item"><button class="del" onclick="removeA(${a.id})">Delete</button><b>${esc(a.title)}</b><br>${esc(a.course||'All Students')}<p>${esc(a.message)}</p></div>`).join('')||'No announcements yet.'}catch(e){list.textContent=e.message}}async function create(){try{await apiCreateAnnouncement({title:title.value,message:message.value,course:course.value||null});msg.textContent='Announcement published.';title.value=message.value='';load()}catch(e){msg.textContent=e.message}}async function removeA(id){if(confirm('Delete this announcement?')){await apiDeleteAnnouncement(id);load()}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
