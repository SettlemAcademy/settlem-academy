<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Announcements Manager | Settlem Academy</title><style>
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f6f8fc;color:#18213d}.wrap{max-width:1050px;margin:auto;padding:30px 20px}.top{background:#101a43;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;margin-left:12px}.card{background:#fff;border:1px solid #e3e8f2;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 25px #1725540b}label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;color:#64748b;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7deea;border-radius:10px;font:inherit}textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.list{display:grid;gap:12px}.item{padding:16px;border:1px solid #e3e8f2;border-radius:14px;background:#fbfcff}.meta{font-size:12px;color:#64748b;margin:6px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost{background:#eef2ff;color:#2563eb}.danger{background:#fff0f0;color:#b42318}.status{font-size:11px;font-weight:900;padding:4px 8px;border-radius:99px;background:#e9f8f2;color:#087443}.off{background:#f1f5f9;color:#64748b}.msg{padding:10px;border-radius:10px;background:#eef2ff;color:#243b8f;margin-bottom:14px;display:none}</style><script src="settlem-api.js?v=20260913"></script><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><div class="top"><strong>SETTLEM ACADEMY · ANNOUNCEMENTS</strong><span><a href="admin-dashboard.html">Dashboard</a><a href="index.html">Website</a></span></div><main class="wrap"><div class="card"><h1>Student Notifications</h1><p>Create important notices for all learners or a specific course.</p><div id="msg" class="msg"></div><form id="form"><label>Title</label><input id="title" required placeholder="e.g. New Probability Test Available"><label>Message</label><textarea id="message" required placeholder="Write the announcement..."></textarea><label>Audience</label><select id="audience"><option value="all">All Students</option><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select><br><br><button class="btn">Publish Announcement</button></form></div><div class="card"><h2>Published & Draft Notices</h2><div id="list" class="list">Loading…</div></div></main><script>
const msg=document.getElementById('msg');function show(t){msg.textContent=t;msg.style.display='block'}
async function load(){try{if(!SettlemAPI.hasSession())return location.href='admin-login.html';const me=await SettlemAPI.request('/me');if(me.role!=='admin')return location.href='admin-login.html';const rows=await SettlemAPI.request('/admin/announcements');list.innerHTML=rows.length?rows.map(a=>`<article class="item"><div><strong>${esc(a.title)}</strong> <span class="status ${a.published?'':'off'}">${a.published?'PUBLISHED':'DRAFT'}</span></div><div class="meta">Audience: ${esc(a.audience)} · ${new Date(a.created_at).toLocaleString()}</div><div>${esc(a.message)}</div><div class="actions" style="margin-top:12px"><button class="btn ghost" onclick="toggle(${a.id},${!a.published})">${a.published?'Unpublish':'Publish'}</button><button class="btn danger" onclick="removeA(${a.id})">Delete</button></div></article>`).join(''):'<div style="color:#64748b">No announcements yet.</div>'}catch(e){show(e.message||'Unable to load announcements.')}}
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
form.addEventListener('submit',async e=>{e.preventDefault();try{await SettlemAPI.request('/announcements',{method:'POST',body:JSON.stringify({title:title.value,message:message.value,audience:audience.value})});form.reset();show('Announcement published successfully.');load()}catch(e){show(e.message||'Could not publish announcement.')}});
async function toggle(id,published){try{await SettlemAPI.request('/announcements/'+id,{method:'PATCH',body:JSON.stringify({published})});load()}catch(e){show(e.message)}}async function removeA(id){if(!confirm('Delete this announcement?'))return;try{await SettlemAPI.request('/announcements/'+id,{method:'DELETE'});load()}catch(e){show(e.message)}}load();</script></body></html>
