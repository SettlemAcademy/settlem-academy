<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcements | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:950px;margin:auto;padding:35px 20px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 10px 30px #101a4310}.tag{display:inline-block;padding:5px 9px;border-radius:8px;background:#eef2ff;color:#4338ca;font-weight:800;font-size:12px}</style></head><body><div class="wrap"><h1>📣 Announcements</h1><div id="list">Loading…</div></div><script src="settlem-api.js"></script><script>async function load(){if(!getToken()){location.href='student-login.html';return}try{const d=await apiAnnouncements();list.innerHTML=d.length?d.map(a=>`<div class="card"><span class="tag">${esc(a.course||'ALL STUDENTS')}</span><h2>${esc(a.title)}</h2><p>${esc(a.message).replace(/\n/g,'<br>')}</p><small>${esc(a.author_name||'Settlem Academy')} · ${new Date(a.created_at).toLocaleString()}</small></div>`).join(''):'No announcements yet.'}catch(e){list.textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
