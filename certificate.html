<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate | Settlem Academy</title><style>@page{size:A4 landscape;margin:0}body{margin:0;background:#eef2ff;font-family:Georgia,serif;color:#18213d}.sheet{max-width:1050px;margin:35px auto;background:#fff;min-height:650px;border:12px solid #101a43;outline:3px solid #7c3aed;outline-offset:-22px;padding:65px;box-sizing:border-box;text-align:center;position:relative}.logo{width:70px;height:70px;object-fit:contain}.eyebrow{font:900 12px Arial;letter-spacing:3px;color:#7c3aed}.title{font-size:48px;margin:12px}.name{font-size:38px;font-weight:bold;border-bottom:1px solid #cbd5e1;display:inline-block;padding:8px 35px}.course{font-size:27px;color:#2563eb;margin:18px}.meta{font:14px Arial;color:#64748b}.btn{font:800 14px Arial;padding:11px 15px;border:0;border-radius:9px;background:#101a43;color:#fff;cursor:pointer;margin-top:20px}@media print{body{background:#fff}.sheet{margin:0;max-width:none;min-height:210mm;height:210mm}.btn{display:none}}</style><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><main class="sheet" id="cert"><img class="logo" src="settlem-academy-logo.png"><div class="eyebrow">SETTLEM ACADEMY</div><div class="title">Certificate of Completion</div><p style="font:17px Arial;color:#64748b">This certificate is proudly presented to</p><div class="name" id="name">—</div><p style="font:17px Arial;color:#64748b">for successfully completing the learning requirements for</p><div class="course" id="course">—</div><p class="meta" id="date">—</p><p class="meta" id="id">—</p><p class="meta">Verify this certificate using the Certificate ID on the Settlem Academy website.</p><button class="btn" onclick="window.print()">Print / Save as PDF</button></main><script>const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){document.getElementById('name').textContent='Certificate ID missing';return}try{const r=await fetch('https://settlem-academy-1.onrender.com/api/certificates/verify/'+encodeURIComponent(id));if(!r.ok)throw 0;const d=await r.json();name.textContent=d.name;course.textContent=d.course;date.textContent='Issued: '+new Date(d.issued_at).toLocaleDateString();document.getElementById('id').textContent='Certificate ID: '+d.certificate_id}catch(e){name.textContent='Certificate not found';course.textContent='Please check the Certificate ID.'}}load();</script></body></html>
