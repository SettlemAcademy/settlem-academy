<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificates | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7ff;color:#17213f}.top{background:#101a43;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;margin-left:12px}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.hero,.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:25px;box-shadow:0 12px 35px #17255412}.hero{background:linear-gradient(135deg,#fff,#eef2ff)}h1{font-size:42px;margin:8px 0}.muted{color:#64748b;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}.cert{border:1px solid #dbe3ff;border-radius:18px;padding:20px}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.empty{text-align:center;padding:30px;color:#64748b;border:1px dashed #cbd5e1;border-radius:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style><script src="settlem-api.js?v=20260913"></script><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><div class="top"><strong>SETTLEM ACADEMY · CERTIFICATES</strong><div><a href="student-dashboard.html">Dashboard</a><a href="index.html">Website</a></div></div><main class="wrap"><section class="hero"><div style="font-size:12px;letter-spacing:1.5px;font-weight:900;color:#7c3aed">ACHIEVEMENT</div><h1>Your Certificates 🏆</h1><p class="muted">Certificates become available after you complete all four learning modules of an enrolled course.</p></section><section style="margin-top:22px" id="status"></section><div class="grid" id="list"></div></main><script>const status=document.getElementById('status'),list=document.getElementById('list');function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function certCard(c){const d=new Date(c.issued_at);return `<article class="cert"><div style="font-size:12px;font-weight:900;color:#2563eb">CERTIFICATE OF COMPLETION</div><h2>${esc(c.course)}</h2><p class="muted">Issued ${d.toLocaleDateString()}</p><p><strong>Certificate ID:</strong> ${esc(c.certificate_id)}</p><div style="margin-top:14px"><a class="btn primary" href="certificate.html?id=${encodeURIComponent(c.certificate_id)}">View Certificate</a></div></article>`}async function load(){if(!SettlemAPI.hasSession()){status.innerHTML='<div class="card"><strong>Secure login required.</strong><p class="muted">Please log in to view your certificates.</p><a class="btn primary" href="student-login.html">Student Login</a></div>';return}try{const rows=await SettlemAPI.request('/certificates');status.innerHTML=rows.length?'<div class="card"><strong>Keep learning — your achievements will appear here.</strong></div>':'<div class="empty">No certificates yet. Complete all 4 modules of an enrolled course to earn one.</div>';list.innerHTML=rows.map(certCard).join('')}catch(e){status.innerHTML='<div class="card">Unable to load certificates. Please log in again if your secure session has expired.</div>'}}load();</script></body></html>
