<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificates | Settlem Academy</title><style>
body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:900;color:#101a43}.btn{border:0;border-radius:10px;padding:12px 16px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:25px}.cert{background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:25px;box-shadow:0 12px 35px #101a4312}.seal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#f59e0b;color:#fff;font-weight:900}.muted{color:#64748b}.empty{padding:30px;background:#fff;border-radius:18px;margin-top:25px}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">SETTLEM ACADEMY</div><h1>My Certificates</h1><div class="muted">Your verified course achievements.</div></div><a href="student-dashboard.html"><button class="btn">Dashboard</button></a></div><div id="list" class="grid"></div></div>
<script src="settlem-api.js"></script><script>
async function load(){if(!getToken()){location.href="student-login.html";return}try{const d=await apiCertificates();const list=document.getElementById("list");if(!d.length){list.innerHTML='<div class="empty">No certificates yet. Complete all four modules of an enrolled course to earn one.</div>';return}list.innerHTML=d.map(c=>`<article class="cert"><div class="seal">SA</div><h2>${esc(c.course)}</h2><p>Certificate of Completion</p><p class="muted">Certificate ID: <b>${esc(c.certificate_id)}</b></p><p class="muted">Issued: ${new Date(c.issued_at).toLocaleDateString()}</p></article>`).join("")}catch(e){document.getElementById("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();
</script></body></html>
