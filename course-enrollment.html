<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Choose Your Course | Settlem Academy</title>
<style>
:root{--navy:#101a43;--blue:#2563eb;--violet:#7c3aed;--teal:#0f9f8f;--amber:#f59e0b;--pink:#ec4899;--bg:#f5f7ff;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#18213d}.top{padding:18px 5%;background:linear-gradient(135deg,var(--navy),#243b8f);color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:#8fe8ff}.top a{color:#fff;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:45px 20px}.hero{text-align:center}.eyebrow{font-size:11px;color:var(--violet);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:44px;margin:7px 0}.hero p{color:var(--muted);line-height:1.6}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 12px 35px #1725540b;position:relative;overflow:hidden}.card:before{content:'';display:block;height:5px;position:absolute;left:0;right:0;top:0;background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink))}.card h2{margin-top:10px}.card p{color:var(--muted);line-height:1.6}.btn{display:inline-block;padding:12px 17px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.selected{outline:3px solid #c4b5fd}.status{font-size:13px;color:#047857;font-weight:800;margin-top:10px}.bottom{text-align:center;margin-top:28px;color:var(--muted)}@media(max-width:700px){.courses{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>
<script src="settlem-api.js?v=20260913"></script><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head>
<body>
<div class="top"><div class="brand"><img src="settlem-academy-logo.png" alt="Settlem Academy logo" style="width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:8px">SETTLEM <span>ACADEMY</span></div><a href="student-dashboard.html">Student Dashboard →</a></div>
<div class="wrap"><section class="hero"><div class="eyebrow">Personalised Learning</div><h1>Choose your mathematics course.</h1><p>Select the courses you want to learn. Your choices are saved in this browser and shown on your Student Dashboard.</p></section><div id="courses" class="courses"></div><div class="bottom">You can add more courses anytime.</div></div>
<script>
const KEY='settlemEnrolledCourses', names=['B.Tech Mathematics','Intermediate Mathematics','Class 10 Mathematics','Classes 5–7 Mathematics'];
const info={
'B.Tech Mathematics':'Build strong university-level mathematical foundations with clear concepts and problem solving.',
'Intermediate Mathematics':'Learn important concepts systematically with exam-focused explanations and practice.',
'Class 10 Mathematics':'Strengthen Class 10 concepts with step-by-step explanations and targeted practice.',
'Classes 5–7 Mathematics':'Make mathematics simple and enjoyable through fundamentals, examples and practice.'
};
let selected=JSON.parse(localStorage.getItem(KEY)||'[]');
async function toggle(c){if(selected.includes(c)){selected=selected.filter(x=>x!==c);localStorage.setItem(KEY,JSON.stringify(selected));render();return}const token=localStorage.getItem('settlemAuthToken');if(!token){alert('Please log in with your student account before enrolling.');location.href='student-login.html';return}try{await SettlemAPI.request('/courses/enroll',{method:'POST',body:JSON.stringify({course:c})});if(!selected.includes(c))selected.push(c);localStorage.setItem(KEY,JSON.stringify(selected));render()}catch(e){alert(e.message||'Unable to save enrollment. Please log in again.')}}
function render(){courses.innerHTML=names.map(c=>`<article class="card ${selected.includes(c)?'selected':''}"><div class="eyebrow">Settlem Academy</div><h2>${c}</h2><p>${info[c]}</p><button class="btn" onclick="toggle(${JSON.stringify(c)})">${selected.includes(c)?'✓ Enrolled':'Enroll in Course'}</button>${selected.includes(c)?'<div class="status">Added to your dashboard</div>':''}</article>`).join('')}
(async()=>{if(localStorage.getItem('settlemAuthToken')){try{const rows=await SettlemAPI.request('/courses');if(Array.isArray(rows)){selected=rows.map(r=>r.course);localStorage.setItem(KEY,JSON.stringify(selected));}}catch(e){}}render()})()
</script>
<div style="text-align:center;padding:18px;font-size:13px"><a href="faq.html">FAQ</a> · <a href="privacy-policy.html">Privacy</a> · <a href="terms.html">Terms</a></div></body>
</html>
