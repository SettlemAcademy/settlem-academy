<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Choose Your Course | Settlem Academy</title>
<style>
:root{--navy:#101a43;--blue:#2563eb;--violet:#7c3aed;--teal:#0f9f8f;--pink:#ec4899;--bg:#f5f7ff;--muted:#64748b;--line:#e2e8f0;--success:#047857;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#18213d}.top{padding:18px 5%;background:linear-gradient(135deg,var(--navy),#243b8f);color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:#8fe8ff}.top a{color:#fff;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:45px 20px}.hero{text-align:center}.eyebrow{font-size:11px;color:var(--violet);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:44px;margin:7px 0}.hero p{color:var(--muted);line-height:1.6}.notice{display:none;margin:20px auto 0;max-width:760px;padding:13px 16px;border-radius:12px;font-weight:700;text-align:center}.notice.show{display:block}.notice.success{background:#ecfdf5;color:var(--success);border:1px solid #a7f3d0}.notice.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}.notice.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 12px 35px #1725540b;position:relative;overflow:hidden}.card:before{content:'';display:block;height:5px;position:absolute;left:0;right:0;top:0;background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink))}.card h2{margin-top:10px}.card p{color:var(--muted);line-height:1.6}.btn{display:inline-block;padding:12px 17px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.selected{outline:3px solid #c4b5fd}.status{font-size:13px;color:var(--success);font-weight:800;margin-top:10px}.bottom{text-align:center;margin-top:28px;color:var(--muted)}@media(max-width:700px){.courses{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>
<script src="settlem-api.js"></script>
</head>
<body>
<div class="top"><div class="brand">SETTLEM <span>ACADEMY</span></div><a href="student-dashboard.html">Student Dashboard →</a></div>
<div class="wrap">
<section class="hero">
<div class="eyebrow">Personalised Learning</div>
<h1>Choose your mathematics course.</h1>
<p>Select the courses you want to learn. Your enrollments are saved securely in your Settlem Academy account.</p>
<div id="notice" class="notice"></div>
</section>
<div id="courses" class="courses"></div>
<div class="bottom">You can add more courses anytime.</div>
</div>
<script>
const API_BASE='https://settlem-academy-api.onrender.com/api';
const courses=[
 {name:'B.Tech Mathematics',desc:'Build strong university-level mathematical foundations with clear concepts and problem solving.'},
 {name:'Intermediate Mathematics',desc:'Learn important concepts systematically with exam-focused explanations and practice.'},
 {name:'Class 10 Mathematics',desc:'Strengthen Class 10 concepts with step-by-step explanations and targeted practice.'},
 {name:'Classes 5–7 Mathematics',desc:'Make mathematics simple and enjoyable through fundamentals, examples and practice.'}
];
let selected=[];
let busy=false;

function getToken(){return localStorage.getItem('settlemAuthToken')||'';}
function showNotice(message,type='info'){
 const el=document.getElementById('notice');
 el.className='notice show '+type;
 el.textContent=message;
}
function render(){
 document.getElementById('courses').innerHTML=courses.map((c,i)=>{
  const enrolled=selected.includes(c.name);
  return `<article class="card ${enrolled?'selected':''}">
   <div class="eyebrow">Settlem Academy</div>
   <h2>${c.name}</h2><p>${c.desc}</p>
   <button type="button" class="btn" id="enroll-${i}" ${enrolled||busy?'disabled':''}>${enrolled?'✓ Enrolled':'Enroll in Course'}</button>
   ${enrolled?'<div class="status">Enrolled successfully — available on your dashboard</div>':''}
  </article>`;
 }).join('');
 courses.forEach((c,i)=>{
  const b=document.getElementById('enroll-'+i);
  if(b) b.addEventListener('click',()=>enroll(c.name,i));
 });
}
async function request(path,options={},timeoutMs=15000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const headers={'Content-Type':'application/json'};
  const t=getToken();
  if(t) headers.Authorization='Bearer '+t;
  const r=await fetch(API_BASE+path,{...options,headers,signal:controller.signal,cache:'no-store'});
  const text=await r.text();
  let data={}; try{data=text?JSON.parse(text):{};}catch(e){data={};}
  if(!r.ok) throw new Error(data.error||`Server returned ${r.status}`);
  return data;
 }catch(e){
  if(e.name==='AbortError') throw new Error('The online server is taking too long to respond. Please try again in a few seconds.');
  throw e;
 }finally{clearTimeout(timer);}
}
async function load(){
 // Always render the courses immediately. Never leave the page blank while Render wakes up.
 render();
 if(!getToken()){
  showNotice('Please log in first, then return here to enroll in a course.','error');
  return;
 }
 showNotice('Checking your Settlem Academy account…','info');
 try{
  const rows=await request('/courses');
  selected=Array.isArray(rows)?rows.map(x=>x.course):[];
  render();
  showNotice(selected.length?'Your enrolled courses are shown below.':'Select a course below to enroll.','info');
 }catch(e){
  console.error(e);
  render();
  showNotice('Could not connect to the online account service. '+e.message,'error');
 }
}
async function enroll(course,index){
 if(busy)return;
 if(!getToken()){
  showNotice('Please log in first.','error');
  return;
 }
 if(selected.includes(course)){
  showNotice('You are already enrolled in '+course+'.','info');
  return;
 }
 busy=true;
 render();
 showNotice('Enrolling you in '+course+'…','info');
 try{
  await request('/courses/enroll',{method:'POST',body:JSON.stringify({course})});
  selected=[...selected,course];
  showNotice('✓ '+course+' enrolled successfully. Open Student Dashboard to continue learning.','success');
 }catch(e){
  console.error('Enrollment failed:',e);
  showNotice('Enrollment failed: '+e.message,'error');
 }finally{
  busy=false;
  render();
 }
}
render();
load();
</script>
</body>
</html>
