<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Payment | Settlem Academy</title><style>
body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:45px 20px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:24px;padding:32px;box-shadow:0 18px 55px #101a4314}.brand{font-weight:900;color:#101a43}.price{font-size:42px;font-weight:900;color:#2563eb}.btn{border:0;border-radius:12px;padding:14px 20px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;cursor:pointer}.muted{color:#64748b}.msg{margin-top:16px;font-weight:700}
</style></head><body><div class="wrap"><div class="brand">SETTLEM ACADEMY</div><div class="card" style="margin-top:20px"><h1 id="title">Course Payment</h1><p class="muted">Secure payment powered by Razorpay.</p><div class="price" id="price">—</div><button id="pay" class="btn">Pay Securely</button><div id="msg" class="msg"></div></div></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="settlem-api.js"></script><script>
const params=new URLSearchParams(location.search),course=params.get("course");
let item;
async function init(){if(!getToken()){location.href="student-login.html";return}if(!course){msg.textContent="Select a course first.";pay.disabled=true;return}try{const d=await apiStoreCourses();item=d.find(x=>x.course===course);if(!item)throw new Error("Course not found");title.textContent=item.title;price.textContent="₹"+item.price.toLocaleString("en-IN");}catch(e){msg.textContent=e.message;pay.disabled=true}}
pay.onclick=async()=>{pay.disabled=true;msg.textContent="Creating secure order…";try{const o=await apiCreatePaymentOrder(item.course);const rzp=new Razorpay({key:o.key_id,amount:o.amount,currency:o.currency,name:"Settlem Academy",description:item.title,order_id:o.order_id,prefill:{name:(JSON.parse(localStorage.getItem("settlemAcademyUser")||"{}").name||""),email:(JSON.parse(localStorage.getItem("settlemAcademyUser")||"{}").email||"")},handler:async response=>{msg.textContent="Verifying payment…";try{await apiVerifyPayment(response);msg.textContent="Payment successful! Course unlocked.";setTimeout(()=>location.href="student-dashboard.html",900)}catch(e){msg.textContent=e.message;pay.disabled=false}}});rzp.on("payment.failed",()=>{msg.textContent="Payment failed or was cancelled.";pay.disabled=false});rzp.open()}catch(e){msg.textContent=e.message;pay.disabled=false}};
init();
</script></body></html>
