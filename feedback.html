<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Feedback | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f7f9fc;color:#17213c}main{max-width:760px;margin:50px auto;padding:0 18px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:22px;padding:28px;box-shadow:0 16px 45px #17255412}a{color:#2563eb;text-decoration:none;font-weight:800}.brand{font-weight:900;color:#172554;margin-bottom:22px}.logo{width:46px;height:46px;object-fit:contain;vertical-align:middle;margin-right:9px}h1{font-size:36px;margin:8px 0}.sub,.muted{color:#64748b;line-height:1.6}.field{margin-top:18px}label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}select,textarea{width:100%;box-sizing:border-box;border:1px solid #cfd8e6;border-radius:12px;padding:12px;font:inherit}textarea{min-height:130px;resize:vertical}.stars{display:flex;gap:7px;flex-wrap:wrap}.star{border:1px solid #cfd8e6;background:#fff;border-radius:10px;padding:10px 13px;font-size:20px;cursor:pointer}.star.active{background:#eef2ff;border-color:#6366f1}.actions{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.msg{min-height:20px;color:#b42318;font-size:13px}.history{margin-top:24px}.item{padding:14px;border:1px solid #e2e8f0;border-radius:13px;margin-top:9px}.success{padding:13px;border-radius:12px;background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}</style><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><main><div class="brand"><img class="logo" src="settlem-academy-logo.png" alt="Settlem Academy logo">SETTLEM ACADEMY</div><div class="card"><a href="student-dashboard.html">← Student Dashboard</a><h1>Share your learning experience</h1><p class="sub">Your feedback helps us improve lessons, resources and exam preparation.</p><div class="field"><label for="course">Course</label><select id="course"><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select></div><div class="field"><label>Your Rating</label><div class="stars" id="stars"></div></div><div class="field"><label for="message">Feedback</label><textarea id="message" maxlength="2000" placeholder="What did you like? What should we improve?"></textarea></div><div class="actions"><button class="btn" id="submit">Submit Feedback</button><span id="msg" class="msg"></span></div><div id="success"></div><div class="history"><h2>Your Previous Feedback</h2><div id="history" class="muted">Loading…</div></div></div></main><script src="settlem-api.js?v=20260913"></script><script>let rating=0;const stars=document.getElementById('stars');function draw(){stars.innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=rating?'active':''}" onclick="rating=${n};draw()" aria-label="${n} stars">★</button>`).join('')}draw();async function load(){const h=document.getElementById('history');if(!SettlemAPI.hasSession()){h.innerHTML='Please <a href="student-login.html">log in</a> to submit and view feedback.';document.getElementById('submit').disabled=true;return}try{const rows=await SettlemAPI.request('/feedback');h.innerHTML=rows.length?rows.map(x=>`<div class="item"><strong>${x.course}</strong> · ${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}<div style="margin-top:6px">${safe(x.message)}</div><small>${new Date(x.created_at).toLocaleDateString()}</small></div>`).join(''):'No feedback submitted yet.'}catch(e){h.textContent=e.message||'Unable to load feedback.'}}function safe(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}document.getElementById('submit').onclick=async()=>{const msg=document.getElementById('msg');msg.textContent='';if(!rating){msg.textContent='Please choose a rating.';return}if(message.value.trim().length<3){msg.textContent='Please enter a little feedback.';return}const b=document.getElementById('submit');b.disabled=true;b.textContent='Submitting…';try{await SettlemAPI.request('/feedback',{method:'POST',body:JSON.stringify({course:course.value,rating,message:message.value.trim()})});document.getElementById('success').innerHTML='<div class="success">Thank you! Your feedback has been submitted.</div>';message.value='';rating=0;draw();load()}catch(e){msg.textContent=e.message||'Unable to submit feedback.'}finally{b.disabled=false;b.textContent='Submit Feedback'}};load();</script></body></html>
