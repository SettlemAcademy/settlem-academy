<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:35px 20px}.hero{background:linear-gradient(135deg,#101a43,#2563eb);color:white;border-radius:24px;padding:28px}.xp{font-size:42px;font-weight:900}.card{background:white;border:1px solid #e5e9f1;border-radius:18px;margin-top:18px;overflow:hidden}.row{display:grid;grid-template-columns:70px 1fr 100px 130px;gap:12px;padding:16px 20px;border-bottom:1px solid #edf0f5;align-items:center}.rank{font-weight:900;font-size:20px}.xpcol{font-weight:900;color:#2563eb}.badge{font-size:12px;font-weight:800;background:#eef2ff;padding:6px 9px;border-radius:99px;display:inline-block}@media(max-width:650px){.row{grid-template-columns:45px 1fr 75px}.badge{display:none}}</style></head><body><div class="wrap"><div class="hero"><h1>🏆 Student Leaderboard</h1><p>Learn, practice, attend live classes and earn XP.</p><div class="xp" id="myxp">— XP</div><small>Your current XP</small></div><div class="card" id="list">Loading…</div></div><script src="settlem-api.js"></script><script>async function load(){if(!getToken()){location.href="student-login.html";return}try{const [rows,me]=await Promise.all([apiLeaderboard(),apiMyPoints()]);myxp.textContent=me.xp+" XP";list.innerHTML='<div class="row"><b>#</b><b>Student</b><b>XP</b><b>Level</b></div>'+rows.map(r=>`<div class="row"><span class="rank">${r.rank}</span><b>${esc(r.name)}</b><span class="xpcol">${r.xp}</span><span class="badge">${esc(r.badge)}</span></div>`).join("")||'<div style="padding:20px">No rankings yet.</div>'}catch(e){list.textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
