<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B.Tech Mathematics Learning Room | Settlem Academy</title>
<style>
:root{--navy:#101a43;--navy2:#17265c;--blue:#2563eb;--violet:#7c3aed;--teal:#0f9f8f;--amber:#f59e0b;--pink:#ec4899;--bg:#f6f8ff;--white:#fff;--line:#e3e8f3;--muted:#64748b;--ink:#18233f;--success:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}
.top{background:linear-gradient(135deg,var(--navy),#263b91);color:#fff;padding:14px 4%;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:20;box-shadow:0 8px 25px #101a4318}.brand{font-weight:900;letter-spacing:.5px}.brand span{color:#8fe8ff}.toplinks{display:flex;gap:8px;flex-wrap:wrap}.toplinks a{border:1px solid #ffffff3d;border-radius:10px;padding:8px 11px;font-size:13px}
.layout{display:grid;grid-template-columns:315px minmax(0,1fr);min-height:calc(100vh - 63px)}aside{background:#fff;border-right:1px solid var(--line);padding:22px 17px}.course-label{font-size:11px;font-weight:900;letter-spacing:1.3px;color:var(--violet);text-transform:uppercase}.course-name{font-size:20px;font-weight:900;margin:5px 0 15px}.overall{padding:15px;border-radius:15px;background:linear-gradient(135deg,#eef3ff,#f7f1ff);border:1px solid #dce4ff;margin-bottom:18px}.overall-row{display:flex;justify-content:space-between;font-weight:900}.track{height:9px;background:#dfe5ef;border-radius:99px;overflow:hidden;margin-top:9px}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink));transition:.25s}
.module{padding:15px;margin:9px 0;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:#fff;transition:.2s}.module:hover{transform:translateY(-1px);box-shadow:0 8px 20px #101a4310}.module.active{background:#eef2ff;border-color:#b9c7ff;box-shadow:0 7px 20px #2563eb14}.module-head{display:flex;gap:10px;align-items:center}.num{width:30px;height:30px;border-radius:10px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:12px}.module.active .num{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.module strong{font-size:14px}.module small{display:block;color:var(--muted);margin-left:40px;margin-top:3px}
main{padding:30px;max-width:1150px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.ey{font-size:11px;font-weight:900;color:var(--violet);letter-spacing:1.4px;text-transform:uppercase}.head h1{margin:5px 0;font-size:clamp(30px,4vw,42px);line-height:1.1}.muted{color:var(--muted)}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:8px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800}
.lesson-area{margin-top:22px}.empty{padding:38px 25px;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;text-align:center}.empty .icon{font-size:46px}.empty h2{margin:8px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 28px #1725540a}.video{background:#0b1027;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 18px 50px #17255420}.video iframe{width:100%;height:100%;border:0}.lesson-meta{font-size:12px;color:var(--violet);font-weight:900;letter-spacing:1px;text-transform:uppercase}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;font-size:13px}.primary{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.secondary{background:#eef2ff;color:#3155c8}.done{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}.outline{background:#fff;border:1px solid #ccd5e1;color:var(--ink)}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.resource{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff}.resource b{display:block;margin-bottom:4px}.resource span{font-size:12px;color:var(--muted)}.notice{display:none;margin-top:15px;padding:12px 14px;border-radius:11px;font-size:13px;font-weight:700}.notice.show{display:block}.notice.ok{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.notice.err{background:#fff1f2;color:#b42318;border:1px solid #fecdd3}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:20px}.resources{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="brand">SETTLEM <span>ACADEMY</span> · LEARNING ROOM</div><div class="toplinks"><a href="student-dashboard.html">Dashboard</a><a href="course-enrollment.html">Courses</a></div></div>
<div class="layout">
<aside>
  <div class="course-label">Current Course</div><div class="course-name">B.Tech Mathematics</div>
  <div class="overall"><div class="overall-row"><span>Course Progress</span><span id="pctSide">0%</span></div><div class="track"><i id="fillSide"></i></div></div>
  <div id="modules"></div>
</aside>
<main>
  <div class="head"><div><div class="ey">Your Learning Space</div><h1 id="title">Mathematical Foundations</h1><p id="desc" class="muted"></p></div><div class="pill" id="moduleStatus">Module 1 of 4</div></div>
  <div class="summary"><span class="pill">🎓 B.Tech Mathematics</span><span class="pill">📚 4 Modules</span><span class="pill">📝 Practice & Revision</span></div>
  <div id="notice" class="notice"></div>
  <div id="content" class="lesson-area"></div>
</main>
</div>
<script>
const API_BASE='https://settlem-academy.onrender.com/api';
const names=['Mathematical Foundations','Core Concepts','Problem Solving','Revision & Preparation'];
const descs=['Build the mathematical foundation required for confident university-level learning.','Develop concepts step by step and connect ideas to practical problem solving.','Apply learned methods through guided examples, practice and exam-style questions.','Review the course systematically and prepare with focused revision and self-checks.'];
const starterLessons=[
 ['Course orientation','Concept introduction','Foundation practice'],
 ['Core concept learning','Worked examples','Self-check questions'],
 ['Problem-solving approach','Step-by-step practice','Application worksheet'],
 ['Quick revision','Important practice','Final self-check']
];
let moduleIndex=Number(localStorage.getItem('settlemCurrentModule')||0); if(moduleIndex<0||moduleIndex>3)moduleIndex=0;
let course='B.Tech Mathematics', videos=[];
const token=()=>localStorage.getItem('settlemAuthToken');
const localProgress=()=>JSON.parse(localStorage.getItem('settlemAcademyLearningProgress')||'{}');
const key=i=>course+'|'+i;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function setNotice(text,type){notice.textContent=text;notice.className='notice show '+type}
function selectModule(i){moduleIndex=i;localStorage.setItem('settlemCurrentModule',String(i));render()}
async function api(path,options={}){const h={'Content-Type':'application/json',...(options.headers||{})};if(token())h.Authorization='Bearer '+token();const r=await fetch(API_BASE+path,{...options,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function loadVideos(){videos=[];if(!token())return;try{const d=await api('/videos?course='+encodeURIComponent(course));videos=Array.isArray(d)?d:(d.videos||[])}catch(e){console.warn(e)}}
function render(){
 const p=localProgress(), done=names.filter((_,i)=>!!p[key(i)]).length, percent=Math.round(done/4*100);
 pctSide.textContent=percent+'%';fillSide.style.width=percent+'%';
 modules.innerHTML=names.map((n,i)=>`<div class="module ${i===moduleIndex?'active':''}" onclick="selectModule(${i})"><div class="module-head"><div class="num">${i+1}</div><strong>${n}</strong></div><small>${p[key(i)]?'✓ Completed':'Not completed yet'}</small></div>`).join('');
 title.textContent=names[moduleIndex];desc.textContent=descs[moduleIndex];moduleStatus.textContent='Module '+(moduleIndex+1)+' of 4';
 const list=videos.filter(v=>v.course===course && v.module===names[moduleIndex]);
 if(list.length){const v=list[0],id=v.video_id||v.videoId;content.innerHTML=`<div class="video"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0" title="${esc(v.title)}" allowfullscreen></iframe></div><div class="card"><div class="lesson-meta">${esc(v.course)} · ${esc(v.module)}</div><h2>${esc(v.title)}</h2><p class="muted">${esc(v.description||'Continue the lesson and practise the concepts covered in this module.')}</p><div class="actions"><button class="btn ${p[key(moduleIndex)]?'done':'primary'}" onclick="toggleComplete()">${p[key(moduleIndex)]?'✓ Module Completed':'Mark Module Complete'}</button><a class="btn secondary" href="study-materials.html">📚 Study Materials</a><a class="btn secondary" href="practice-tests.html">📝 Practice Tests</a></div></div>`;return}
 const ls=starterLessons[moduleIndex];
 content.innerHTML=`<div class="empty"><div class="icon">📘</div><h2>${names[moduleIndex]}</h2><p class="muted">This module is ready. Lessons will appear here as they are published by the academy.</p><div class="resources"><div class="resource"><b>🎥 Video Lessons</b><span>${ls[0]}</span></div><div class="resource"><b>📄 Study Material</b><span>${ls[1]}</span></div><div class="resource"><b>📝 Practice</b><span>${ls[2]}</span></div></div><div class="actions" style="justify-content:center"><button class="btn ${p[key(moduleIndex)]?'done':'primary'}" onclick="toggleComplete()">${p[key(moduleIndex)]?'✓ Module Completed':'Mark Module Complete'}</button><a class="btn secondary" href="video-lessons.html">Browse Video Lessons</a><a class="btn secondary" href="study-materials.html">Study Materials</a><a class="btn secondary" href="practice-tests.html">Practice Tests</a></div></div>`;
}
async function toggleComplete(){const p=localProgress(),k=key(moduleIndex),next=!p[k];p[k]=next;localStorage.setItem('settlemAcademyLearningProgress',JSON.stringify(p));try{if(token())await api('/progress',{method:'POST',body:JSON.stringify({course,module_index:moduleIndex,completed:next})});setNotice(next?'Module completed successfully. Your progress has been updated.':'Module marked incomplete.','ok')}catch(e){setNotice('Saved on this device, but the online progress update failed: '+e.message,'err')}render()}
(async()=>{await loadVideos();render()})();
</script>
</body></html>
