<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Room | Settlem Academy</title><style>
:root{--n:#101a43;--b:#2563eb;--v:#7c3aed;--t:#0f9f8f;--bg:#f5f7ff;--line:#e2e8f0;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:var(--bg);color:#18213d}.top{background:linear-gradient(135deg,var(--n),#263b91);color:#fff;padding:15px 4%;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}.top a{color:#fff;text-decoration:none;border:1px solid #fff4;padding:9px 12px;border-radius:9px}.layout{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--line);padding:22px 16px}.select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-weight:800}.module{padding:15px;margin:9px 0;border:1px solid transparent;border-radius:14px;cursor:pointer}.module.active{background:#eef2ff;border-color:#c7d2fe}.module small{color:var(--muted)}main{padding:30px;max-width:1100px;width:100%}.head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.ey{font-size:11px;font-weight:900;color:var(--v);letter-spacing:1.4px;text-transform:uppercase}.head h1{margin:6px 0;font-size:34px}.muted{color:var(--muted)}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;width:240px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--v));transition:.3s}.video{margin-top:22px;background:#0b1027;border-radius:20px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 18px 50px #17255420}.video iframe{width:100%;height:100%;border:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;border:0;border-radius:11px;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,var(--b),var(--v));color:#fff}.secondary{background:#eef2ff;color:var(--b)}.done{background:#166534;color:#fff}.empty{text-align:center;padding:45px 20px;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:18px;margin-top:20px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:20px}}
</style></head><body><div class="top"><b>SETTLEM ACADEMY · LEARNING ROOM</b><a href="student-dashboard.html">Dashboard</a></div><div class="layout"><aside><select id="courseSelect" class="select" onchange="setCourse(this.value)"><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select><div id="modules"></div></aside><main><div class="head"><div><div class="ey">Your Learning Space</div><h1 id="title">Mathematical Foundations</h1><p id="desc" class="muted"></p></div><div><b id="pct">0% Complete</b><div class="bar"><i id="fill"></i></div></div></div><div id="content"></div></main></div><script src="settlem-api.js"></script><script>
const names=['Mathematical Foundations','Core Concepts','Problem Solving','Revision & Preparation'],descs=['Build the concepts you need before moving into advanced problem solving.','Learn key ideas step by step with clear explanations.','Apply concepts through worked examples and exam-style questions.','Revise efficiently and prepare with focused practice.'];let course=localStorage.getItem('settlemCurrentCourse')||'B.Tech Mathematics',moduleIndex=0,videos=[];
const localVideos=()=>JSON.parse(localStorage.getItem('settlemAcademyVideos')||'[]'),progress=()=>JSON.parse(localStorage.getItem('settlemAcademyLearningProgress')||'{}'),key=i=>course+'|'+i;
function setCourse(c){course=c;localStorage.setItem('settlemCurrentCourse',c);moduleIndex=0;load()};function selectModule(i){moduleIndex=i;render()};
async function load(){videos=[];if(getToken()){try{videos=await apiVideos(course)}catch(e){}}render()}
function render(){courseSelect.value=course;const p=progress();modules.innerHTML=names.map((n,i)=>`<div class="module ${i===moduleIndex?'active':''}" onclick="selectModule(${i})"><b>${i+1}. ${n}</b><br><small>${p[key(i)]?'✓ Completed':'Start module'}</small></div>`).join('');title.textContent=names[moduleIndex];desc.textContent=descs[moduleIndex];const completed=names.filter((_,i)=>p[key(i)]).length;const percent=Math.round(completed/4*100);pct.textContent=percent+'% Complete';fill.style.width=percent+'%';const list=(videos.length?videos:localVideos()).filter(v=>v.course===course&&v.module===names[moduleIndex]);if(!list.length){content.innerHTML=`<div class="empty"><div style="font-size:44px">▶</div><h2>No lesson published yet</h2><p>A teacher or admin can publish a lesson for this module from the Content Center.</p><a class="btn primary" href="video-lessons.html">Browse Video Lessons</a></div>`;return}const v=list[0],id=v.video_id||v.videoId;content.innerHTML=`<div class="video"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0" title="${esc(v.title)}" allowfullscreen></iframe></div><section class="card"><div class="ey">${esc(v.course)} · ${esc(v.module)}</div><h2>${esc(v.title)}</h2><p class="muted">${esc(v.description||'Continue the lesson and practise the concepts covered in this video.')}</p><div class="actions"><button class="btn ${p[key(moduleIndex)]?'done':'primary'}" onclick="toggle()">${p[key(moduleIndex)]?'✓ Completed':'Mark as Complete'}</button><a class="btn secondary" href="study-materials.html">Study Materials</a><a class="btn secondary" href="practice-tests.html">Practice Tests</a><a class="btn secondary" href="live-classes.html">Live Classes</a></div></section>`}
async function toggle(){const p=progress(),k=key(moduleIndex);p[k]=!p[k];localStorage.setItem('settlemAcademyLearningProgress',JSON.stringify(p));try{if(getToken())await api('/progress',{method:'POST',body:JSON.stringify({course,module_index:moduleIndex,completed:p[k]})})}catch(e){}render()};function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();
</script></body></html>
