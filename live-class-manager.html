<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Class Manager</title><style>body{font:16px Arial;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:30px}.card{background:white;padding:22px;border-radius:18px;margin:15px 0}input,select,textarea{width:100%;padding:11px;margin:6px 0;box-sizing:border-box}button{padding:11px 15px;background:#2563eb;color:white;border:0;border-radius:9px;font-weight:bold}.item{padding:14px 0;border-bottom:1px solid #ddd}</style><div class="wrap"><h1>🎥 Live Class Manager</h1><div class="card"><input id="title" placeholder="Class title"><select id="course"><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select><input id="when" type="datetime-local"><input id="duration" type="number" value="60"><input id="link" placeholder="Meeting link"><textarea id="desc" placeholder="Description"></textarea><button onclick="create()">Schedule Class</button><p id="msg"></p></div><div class="card"><h2>Scheduled Classes</h2><div id="list">Loading…</div></div></div><script src="settlem-api.js"></script><script>async function load(){try{let m=await apiMe();if(!["teacher","admin"].includes(m.role))throw Error("Teacher/Admin access required");let d=await apiLiveClasses();list.innerHTML=d.map(c=>`<div class=item><b>${c.title}</b><br>${c.course} · ${new Date(c.scheduled_at).toLocaleString()} · ${c.duration_minutes} min<br><a target=_blank href="${c.meeting_url}">Open Meeting</a> <button onclick="del(${c.id})">Delete</button></div>`).join("")||"No classes scheduled."}catch(e){list.textContent=e.message}}async function create(){try{await apiCreateLiveClass({title:title.value,course:course.value,scheduled_at:new Date(when.value).toISOString(),duration_minutes:duration.value,meeting_url:link.value,description:desc.value});msg.textContent="Scheduled successfully.";load()}catch(e){msg.textContent=e.message}}async function del(id){if(confirm("Delete?")){await apiDeleteLiveClass(id);load()}}load();</script>
