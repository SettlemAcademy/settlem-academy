<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Classes</title><style>body{font:16px Arial;background:#f5f7fb;color:#172033}.wrap{max-width:950px;margin:auto;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:white;padding:22px;border-radius:18px}.btn{display:inline-block;padding:10px 14px;background:#2563eb;color:white;text-decoration:none;border-radius:9px;font-weight:bold}</style><div class=wrap><h1>🎥 Upcoming Live Classes</h1><div class=grid id=grid>Loading…</div></div><script src="settlem-api.js"></script><script>async function load(){try{let d=await apiLiveClasses();grid.innerHTML=d.map(c=>`<div class=card><h2>${c.title}</h2><b>${c.course}</b><p>📅 ${new Date(c.scheduled_at).toLocaleString()}<br>⏱ ${c.duration_minutes} minutes</p><p>${c.description||""}</p><a class=btn target=_blank href="${c.meeting_url}">Join Class</a></div>`).join("")||"No upcoming live classes for your enrolled courses."}catch(e){grid.textContent=e.message}}load()</script>
