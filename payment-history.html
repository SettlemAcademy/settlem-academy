<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | Settlem Academy</title><style>body{font-family:Inter,Segoe UI,Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:950px;margin:auto;padding:40px 20px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:20px;margin:12px 0}.paid{color:#087443;font-weight:800}.pending{color:#a15c00;font-weight:800}</style></head><body><div class="wrap"><h1>Payment History</h1><div id="list">Loading…</div></div><script src="settlem-api.js"></script><script>async function load(){if(!getToken()){location.href="student-login.html";return}try{const d=await apiPayments();list.innerHTML=d.length?d.map(p=>`<div class="card"><b>${esc(p.course)}</b><div>₹${Number(p.amount).toLocaleString("en-IN")} · <span class="${p.status}">${p.status}</span></div><small>${p.razorpay_order_id}</small></div>`).join(""):"No payments yet."}catch(e){list.textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();</script></body></html>
