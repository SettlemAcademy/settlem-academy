<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Practice Tests | Settlem Academy</title>
<style>
:root{--navy:#101a43;--blue:#2563eb;--violet:#7c3aed;--bg:#f5f7ff;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#18213d}.top{background:linear-gradient(135deg,var(--navy),#243b8f);color:#fff;padding:17px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:#8fe8ff}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 13px;border-radius:10px}.wrap{max-width:1000px;margin:auto;padding:35px 20px}.hero{background:linear-gradient(135deg,#fff,#eef2ff);border:1px solid #dbe3ff;border-radius:24px;padding:28px}.eyebrow{font-size:11px;color:var(--violet);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:40px;margin:7px 0}.hero p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;margin-top:20px}.option{display:block;padding:13px;border:1px solid var(--line);border-radius:10px;margin:9px 0;cursor:pointer}.option:hover{background:#f5f7ff}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.secondary{background:#eef2ff;color:var(--blue)}.result{font-size:32px;font-weight:900}.review{padding:12px;background:#f8faff;border-radius:10px;margin:8px 0}.good{color:#047857;font-weight:800}.bad{color:#be123c;font-weight:800}.testselect{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.notice{padding:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;color:#9a3412}
</style><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head>
<body><div class="top"><div class="brand"><img src="settlem-academy-logo.png" alt="Settlem Academy logo" style="width:36px;height:36px;object-fit:contain;border-radius:9px;vertical-align:middle;margin-right:9px">SETTLEM <span>ACADEMY</span> · PRACTICE</div><a href="student-dashboard.html">Student Dashboard</a></div>
<div class="wrap"><section class="hero"><div class="eyebrow">Assessment</div><h1>Practice Tests</h1><p>Test your understanding and get your score instantly. Your result is saved to your student account.</p></section><div class="card" id="app">Loading tests…</div></div>
<script src="settlem-api.js?v=20260913"></script><script>
let tests=[],test=null,index=0,answers=[];
const app=document.getElementById('app');
async function load(){
 try{
  if(!SettlemAPI.hasSession()){const localOnly=SettlemAPI.hasLocalSession();app.innerHTML='<div class="notice"><strong>'+(localOnly?'Secure login required for Practice Tests.':'Please log in first.')+'</strong><br>'+(localOnly?'Your current browser session is local-only. Log out and log back in with your student account so your test score can be saved securely.':'Practice test scores are saved to your student account.')+'</div><p><a class="btn primary" href="student-login.html">Student Login</a></p>';return}
  tests=await SettlemAPI.request('/tests');
  if(!tests.length){app.innerHTML='<h2>No published tests yet.</h2><p style="color:#64748b">New assessments will appear here when published.</p>';return}
  await chooseTest(tests[0].id);
 }catch(e){
  const expired=!SettlemAPI.hasSession();
  app.innerHTML='<div class="notice"><strong>'+(expired?'Your secure session has expired.':'Unable to load tests.')+'</strong><br>'+esc(e.message)+'</div><p><a class="btn primary" href="student-login.html">Log in again</a></p>';
 }
}
async function chooseTest(id){test=await SettlemAPI.request('/tests/'+encodeURIComponent(id));index=0;answers=[];render()}
function render(){
 if(!test)return;
 if(index>=test.questions.length){finish();return}
 const q=test.questions[index];
 app.innerHTML=`<div class="eyebrow">${esc(test.course)}</div><h2>${esc(test.title)}</h2><p>${esc(test.instructions||'')}</p><p><strong>Question ${index+1} of ${test.questions.length}</strong></p><div style="height:8px;background:#e2e8f0;border-radius:99px"><i style="display:block;height:100%;width:${index/test.questions.length*100}%;background:linear-gradient(90deg,#2563eb,#7c3aed)"></i></div><div style="margin-top:22px"><h3>${esc(q.question)}</h3>${[q.option_a,q.option_b,q.option_c,q.option_d].map((o,j)=>`<label class="option"><input type="radio" name="ans" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div><button class="btn primary" onclick="next()">${index===test.questions.length-1?'Finish Test':'Next Question →'}</button>`;
}
function next(){const r=document.querySelector('input[name=ans]:checked');if(!r){alert('Please choose an answer.');return}answers[index]=Number(r.value);index++;render()}
async function finish(){
 app.innerHTML='<p>Submitting your test…</p>';
 try{
  const result=await SettlemAPI.request('/tests/'+test.id+'/submit',{method:'POST',body:JSON.stringify({answers})});
  localStorage.setItem('settlemLatestTest',JSON.stringify({testId:test.id,title:test.title,score:result.score,correct:result.correct,total:result.total,date:new Date().toISOString()}));
  app.innerHTML=`<div class="eyebrow">Test Complete</div><h2>${esc(test.title)}</h2><div class="result">${result.score}%</div><p>You answered <strong>${result.correct}</strong> out of <strong>${result.total}</strong> correctly.</p><p><strong>Your score has been saved to your Student Dashboard.</strong></p><button class="btn primary" onclick="restart()">Retake Test</button> <a class="btn secondary" href="student-dashboard.html">View Dashboard</a>`;
 }catch(e){app.innerHTML='<div class="notice"><strong>Could not save the result.</strong><br>'+esc(e.message)+'</div><button class="btn primary" onclick="restart()">Try Again</button>'}
}
function restart(){index=0;answers=[];render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
load();
</script><div style="text-align:center;padding:18px;font-size:13px"><a href="faq.html">FAQ</a> · <a href="privacy-policy.html">Privacy</a> · <a href="terms.html">Terms</a></div></body></html>
