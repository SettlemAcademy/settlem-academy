<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Practice Tests | Settlem Academy</title>
<style>
:root{--navy:#101a43;--blue:#2563eb;--violet:#7c3aed;--teal:#0f9f8f;--amber:#f59e0b;--pink:#ec4899;--bg:#f5f7ff;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#18213d}.top{background:linear-gradient(135deg,var(--navy),#243b8f);color:#fff;padding:17px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:#8fe8ff}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 13px;border-radius:10px}.wrap{max-width:1000px;margin:auto;padding:35px 20px}.hero{background:linear-gradient(135deg,#fff,#eef2ff);border:1px solid #dbe3ff;border-radius:24px;padding:28px}.eyebrow{font-size:11px;color:var(--violet);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:40px;margin:7px 0}.hero p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;margin-top:20px}.option{display:block;padding:13px;border:1px solid var(--line);border-radius:10px;margin:9px 0;cursor:pointer}.option:hover{background:#f5f7ff}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.secondary{background:#eef2ff;color:var(--blue)}.result{font-size:32px;font-weight:900}.review{padding:12px;background:#f8faff;border-radius:10px;margin:8px 0}.good{color:#047857;font-weight:800}.bad{color:#be123c;font-weight:800}.testselect{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
</style></head>
<body><div class="top"><div class="brand">SETTLEM <span>ACADEMY</span> · PRACTICE</div><a href="student-dashboard.html">Student Dashboard</a></div>
<div class="wrap"><section class="hero"><div class="eyebrow">Assessment</div><h1>Practice Tests</h1><p>Test your understanding and get your score instantly.</p></section><div class="card" id="app"></div></div>
<script src="settlem-api.js"></script><script>
const KEY='settlemAcademyTests',RESULT='settlemLatestTest';let tests=[],test=null,index=0,answers=[],central=false;
async function load(){if(getToken()){try{tests=await apiTests();central=true;let id=localStorage.getItem('settlemSelectedTest');test=tests.find(t=>String(t.id)===String(id))||tests[0]||null;if(test){test=await apiTest(test.id);test.questions=test.questions.map(q=>({id:q.id,q:q.question,opts:[q.option_a,q.option_b,q.option_c,q.option_d]}))}render();return}catch(e){console.warn('Test API unavailable:',e.message)}}tests=JSON.parse(localStorage.getItem(KEY)||'[]').filter(t=>t.published&&t.questions?.length);let id=localStorage.getItem('settlemSelectedTest');test=tests.find(t=>t.id===id)||tests[0]||null;render()}
function render(){if(!test){app.innerHTML='<h2>No tests available</h2><p style="color:#64748b">Enroll in a course and published tests will appear here.</p>';return}if(index>=test.questions.length){finish();return}let q=test.questions[index];app.innerHTML=`<div class="eyebrow">${esc(test.course)}</div><h2>${esc(test.title)}</h2><p><strong>Question ${index+1} of ${test.questions.length}</strong></p><div style="height:8px;background:#e2e8f0;border-radius:99px"><i style="display:block;height:100%;width:${index/test.questions.length*100}%;background:linear-gradient(90deg,#2563eb,#7c3aed)"></i></div><div style="margin-top:22px"><h3>${esc(q.q)}</h3>${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="ans" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div><button class="btn primary" onclick="next()">${index===test.questions.length-1?'Finish Test':'Next Question →'}</button>`}
async function next(){let r=document.querySelector('input[name=ans]:checked');if(!r){alert('Please choose an answer.');return}answers[index]=Number(r.value);index++;render()}
async function finish(){if(central){try{const d=await apiSubmitTest(test.id,answers);localStorage.setItem(RESULT,JSON.stringify({testId:test.id,title:test.title,score:d.score,correct:d.correct,total:d.total,date:new Date().toISOString()}));showResult(d.score,d.correct,d.total);return}catch(e){alert('Could not submit test: '+e.message);return}}let score=answers.reduce((n,a,i)=>n+(a===test.questions[i].correct?1:0),0),pct=Math.round(score/test.questions.length*100);localStorage.setItem(RESULT,JSON.stringify({testId:test.id,title:test.title,score:pct,correct:score,total:test.questions.length,date:new Date().toISOString()}));showResult(pct,score,test.questions.length)}
function showResult(pct,score,total){app.innerHTML=`<div class="eyebrow">Test Complete</div><h2>${esc(test.title)}</h2><div class="result">${pct}%</div><p>You answered <strong>${score}</strong> out of <strong>${total}</strong> correctly.</p><button class="btn primary" onclick="restart()">Retake Test</button> <a class="btn secondary" href="student-dashboard.html">View Dashboard</a>`}
function restart(){index=0;answers=[];render()} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))} load();
</script><script>
const KEY='settlemAcademyTests',RESULT='settlemLatestTest';let tests=[],test=null,index=0,answers=[];
function load(){tests=JSON.parse(localStorage.getItem(KEY)||'[]').filter(t=>t.published&&t.questions?.length);let selected=localStorage.getItem('settlemSelectedTest');test=tests.find(t=>t.id===selected)||tests[0]||null;render()}
function render(){if(!test){app.innerHTML='<h2>No published tests yet.</h2><p style="color:#64748b">Admin can create a test from the Test Engine.</p><a class="btn primary" href="index.html">Back to Website</a>';return}if(index>=test.questions.length){finish();return}let q=test.questions[index];app.innerHTML=`<div class="eyebrow">${esc(test.course)}</div><h2>${esc(test.title)}</h2><p><strong>Question ${index+1} of ${test.questions.length}</strong></p><div style="height:8px;background:#e2e8f0;border-radius:99px"><i style="display:block;height:100%;width:${((index)/test.questions.length)*100}%;background:linear-gradient(90deg,#2563eb,#7c3aed)"></i></div><div style="margin-top:22px"><h3>${esc(q.q)}</h3>${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="ans" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div><button class="btn primary" onclick="next()">${index===test.questions.length-1?'Finish Test':'Next Question →'}</button>`}
function next(){let r=document.querySelector('input[name=ans]:checked');if(!r){alert('Please choose an answer.');return}answers[index]=Number(r.value);index++;render()}
function finish(){let score=answers.reduce((n,a,i)=>n+(a===test.questions[i].correct?1:0),0),pct=Math.round(score/test.questions.length*100);localStorage.setItem(RESULT,JSON.stringify({testId:test.id,title:test.title,score:pct,correct:score,total:test.questions.length,date:new Date().toISOString()}));app.innerHTML=`<div class="eyebrow">Test Complete</div><h2>${esc(test.title)}</h2><div class="result">${pct}%</div><p>You answered <strong>${score}</strong> out of <strong>${test.questions.length}</strong> correctly.</p><div style="margin:20px 0">${test.questions.map((q,i)=>`<div class="review"><strong>${i+1}. ${esc(q.q)}</strong><br><span class="${answers[i]===q.correct?'good':'bad'}">${answers[i]===q.correct?'✓ Correct':'✕ Incorrect'}</span> · Correct answer: ${String.fromCharCode(65+q.correct)}. ${esc(q.opts[q.correct])}</div>`).join('')}</div><button class="btn primary" onclick="restart()">Retake Test</button> <a class="btn secondary" href="student-dashboard.html">View Dashboard</a>`}
function restart(){index=0;answers=[];render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();
</script></body></html>
