<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Progress | Settlem Academy</title><style>body{font-family:Arial;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:35px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:22px}.num{font-size:34px;font-weight:900;color:#2563eb}.bar{height:12px;background:#e7edf6;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0}</style></head><body><div class="wrap"><h1>📊 My Learning Analytics</h1><div class="grid"><div class="card"><div class="num" id="prog">—</div>Overall Progress</div><div class="card"><div class="num" id="att">—</div>Classes Attended</div><div class="card"><div class="num" id="tests">—</div>Tests Taken</div><div class="card"><div class="num" id="avg">—</div>Average Test Score</div></div><div class="card" style="margin-top:18px"><h2>Course Progress</h2><div class="bar"><div class="fill" id="fill"></div></div><p id="courses"></p></div></div><script src="settlem-api.js"></script><script>async function load(){if(!getToken()){location.href="student-login.html";return}try{const d=await apiStudentAnalytics();prog.textContent=d.overall_progress+"%";att.textContent=d.classes_attended;tests.textContent=d.tests_taken;avg.textContent=d.average_test_score+"%";fill.style.width=d.overall_progress+"%";courses.textContent=d.courses.length?"Enrolled: "+d.courses.join(" · "):"No courses enrolled yet."}catch(e){courses.textContent=e.message}}load();</script></body></html>
