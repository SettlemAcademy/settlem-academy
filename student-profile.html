<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:35px 20px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 10px 35px #101a4310}label{font-weight:800;display:block;margin-top:12px}input,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #dbe2ed;border-radius:10px}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;cursor:pointer}.muted{color:#64748b}.msg{font-weight:800;margin-top:12px}</style></head><body><div class="wrap"><h1>👤 My Profile</h1><p class="muted">Manage your Settlem Academy account details.</p><div class="card"><h2>Account Details</h2><label>Name</label><input id="name"><label>Email</label><input id="email" disabled><label>Phone</label><input id="phone"><label>Profile Image URL</label><input id="avatar_url"><label>About Me</label><textarea id="bio" rows="4"></textarea><button onclick="save()">Save Profile</button><div id="msg" class="msg"></div></div><div class="card"><h2>Change Password</h2><input id="current_password" type="password" placeholder="Current password"><input id="new_password" type="password" placeholder="New password (8+ characters)"><button onclick="changePassword()">Update Password</button><div id="passmsg" class="msg"></div></div></div><script src="settlem-api.js"></script><script>async function load(){if(!getToken()){location.href='student-login.html';return}try{const p=await apiProfile();name.value=p.name||'';email.value=p.email||'';phone.value=p.phone||'';avatar_url.value=p.avatar_url||'';bio.value=p.bio||''}catch(e){msg.textContent=e.message}}async function save(){try{await apiUpdateProfile({name:name.value,phone:phone.value,avatar_url:avatar_url.value,bio:bio.value});msg.textContent='Profile updated successfully.';const u=JSON.parse(localStorage.getItem('settlemAcademyUser')||'{}');u.name=name.value;localStorage.setItem('settlemAcademyUser',JSON.stringify(u))}catch(e){msg.textContent=e.message}}async function changePassword(){try{await apiChangePassword({current_password:current_password.value,new_password:new_password.value});passmsg.textContent='Password updated successfully.';current_password.value=new_password.value=''}catch(e){passmsg.textContent=e.message}}load();</script></body></html>
