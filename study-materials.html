<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study Materials | Settlem Academy</title>
<style>
:root{--navy:#101a43;--blue:#2563eb;--violet:#7c3aed;--teal:#0f9f8f;--amber:#f59e0b;--pink:#ec4899;--bg:#f5f7ff;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#18213d}.top{background:linear-gradient(135deg,var(--navy),#243b8f);color:#fff;padding:17px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:#8fe8ff}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 13px;border-radius:10px}.wrap{max-width:1150px;margin:auto;padding:32px 20px}.hero{background:linear-gradient(135deg,#fff,#eef2ff);border:1px solid #dbe3ff;border-radius:24px;padding:28px}.eyebrow{font-size:11px;color:var(--violet);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:42px;margin:7px 0}.hero p{color:var(--muted);line-height:1.6}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filters select{padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 10px 30px #1725540a;position:relative;overflow:hidden}.card:before{content:'';height:4px;position:absolute;top:0;left:0;right:0;background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink))}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2ff;color:var(--blue);font-size:11px;font-weight:800;margin:2px}.card h2{margin:10px 0 6px}.card p{color:var(--muted);line-height:1.55}.btn{display:inline-block;padding:11px 14px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;text-decoration:none;font-weight:800}.empty{text-align:center;color:var(--muted);padding:40px;border:1px dashed #cbd5e1;border-radius:16px;background:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style></head>
<body><div class="top"><div class="brand">SETTLEM <span>ACADEMY</span> · STUDY MATERIALS</div><a href="student-dashboard.html">Student Dashboard</a></div>
<div class="wrap"><section class="hero"><div class="eyebrow">Learn Smarter</div><h1>Study Materials</h1><p>Find notes, formulas, important questions and revision resources for your course.</p></section>
<div class="filters"><select id="course" onchange="render()"><option value="">All Courses</option><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select><select id="type" onchange="render()"><option value="">All Types</option><option>Chapter Notes</option><option>Formula Sheet</option><option>Important Questions</option><option>Practice Worksheet</option><option>Revision Pack</option><option>Test Preparation</option></select></div>
<div id="grid" class="grid"></div></div>
<script src="settlem-api.js"></script><script>
const KEY='settlemAcademyMaterials';let central=[];
async function load(){if(getToken()){try{central=await apiMaterials(course.value,type.value);render();return}catch(e){console.warn('Materials API unavailable:',e.message)}}central=[];render()}
function render(){let c=course.value,t=type.value,a=(central.length?central:JSON.parse(localStorage.getItem(KEY)||'[]')).filter(x=>(!c||x.course===c)&&(!t||x.type===t));grid.innerHTML=a.length?a.map(x=>`<article class="card"><span class="pill">${esc(x.course)}</span><span class="pill">${esc(x.type)}</span><h2>${esc(x.title)}</h2><p>${esc(x.description||'Open this resource to continue studying.')}</p><a class="btn" href="${esc(x.url)}" target="_blank">Open Resource →</a></article>`).join(''):'<div class="empty" style="grid-column:1/-1"><h2>No resources yet</h2><p>Published study materials for your enrolled courses will appear here.</p></div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))} load();
</script><script>
const KEY='settlemAcademyMaterials';
function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function render(){let c=course.value,t=type.value,a=get().filter(x=>(!c||x.course===c)&&(!t||x.type===t));grid.innerHTML=a.length?a.map(x=>`<article class="card"><span class="pill">${esc(x.course)}</span><span class="pill">${esc(x.type)}</span><h2>${esc(x.title)}</h2><p>${esc(x.description||'Open this resource to continue studying.')}</p><a class="btn" href="${esc(x.url)}" target="_blank">Open Resource →</a></article>`).join(''):'<div class="empty" style="grid-column:1/-1"><h2>No resources yet</h2><p>Published study materials will appear here.</p></div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}render()
</script></body></html>
