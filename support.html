<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Support | Settlem Academy</title><style>
:root{--navy:#101a43;--blue:#2563eb;--violet:#7c3aed;--bg:#f6f8ff;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:var(--bg);color:#18213d}.top{background:linear-gradient(135deg,var(--navy),#293e87);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:35px 20px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 10px 30px #101a4310}.hero{background:linear-gradient(135deg,#fff,#eef2ff)}h1{font-size:clamp(30px,5vw,44px);margin:8px 0}.muted{color:var(--muted);line-height:1.6}.form{margin-top:20px;display:grid;gap:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}input,select,textarea{width:100%;margin-top:6px;padding:13px;border:1px solid #d7deea;border-radius:11px;font:inherit}textarea{min-height:140px;resize:vertical}.btn{border:0;border-radius:11px;padding:13px 17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));cursor:pointer}.tickets{margin-top:28px;display:grid;gap:12px}.ticket{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#eef2ff;color:var(--blue)}.resolved{background:#e8f8f3;color:#087f68}.in_progress{background:#fff5dc;color:#a16207}.msg{min-height:20px;font-size:13px}.empty{text-align:center;padding:22px;color:var(--muted);border:1px dashed #cbd5e1;border-radius:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style><script src="settlem-api.js?v=20260913"></script><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><header class="top"><strong>SETTLEM ACADEMY · SUPPORT</strong><a href="student-dashboard.html">← Dashboard</a></header><main class="wrap"><section class="hero"><div style="font-size:12px;font-weight:900;color:var(--violet);letter-spacing:.12em;text-transform:uppercase">Student Help Center</div><h1>How can we help?</h1><p class="muted">Send a support request for course content, tests, certificates, enrollment or technical issues. You can track every request here.</p></section><section class="card" style="margin-top:20px"><h2>New Support Request</h2><form id="supportForm" class="form"><div class="grid"><div><label>Course</label><select id="course"><option value="">General / Not course-specific</option><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select></div><div><label>Category</label><select id="category"><option>General</option><option>Course Content</option><option>Technical Issue</option><option>Test / Assessment</option><option>Certificate</option><option>Enrollment / Payment</option></select></div></div><div><label>Subject</label><input id="subject" required maxlength="160" placeholder="What do you need help with?"></div><div><label>Message</label><textarea id="message" required maxlength="3000" placeholder="Describe the issue or question clearly…"></textarea></div><button class="btn" id="send">Submit Support Request</button><div id="msg" class="msg"></div></form></section><section class="card" style="margin-top:20px"><h2>My Requests</h2><div id="tickets" class="tickets"><div class="empty">Loading…</div></div></section></main><script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){return new Date(s).toLocaleString()}async function load(){const box=document.getElementById('tickets');if(!SettlemAPI.hasSession()){box.innerHTML='<div class="empty">Please log in to submit and track support requests.</div>';document.getElementById('supportForm').style.display='none';return}try{const rows=await SettlemAPI.request('/support');box.innerHTML=rows.length?rows.map(t=>`<article class="ticket"><div style="display:flex;justify-content:space-between;gap:10px"><strong>#${t.id} · ${esc(t.subject)}</strong><span class="badge ${t.status}">${t.status.replace('_',' ')}</span></div><div class="muted" style="font-size:13px;margin-top:6px">${esc(t.category)}${t.course?' · '+esc(t.course):''} · ${fmt(t.created_at)}</div><p style="line-height:1.55">${esc(t.message)}</p>${t.admin_note?`<div style="padding:12px;background:#f8fafc;border-radius:10px;font-size:13px"><strong>Admin response:</strong> ${esc(t.admin_note)}</div>`:''}</article>`).join(''):'<div class="empty">No support requests yet.</div>'}catch(e){box.innerHTML='<div class="empty">Unable to load support requests. Please sign in again if your session expired.</div>'}}document.getElementById('supportForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('send'),m=document.getElementById('msg');b.disabled=true;b.textContent='Sending…';m.textContent='';try{await SettlemAPI.request('/support',{method:'POST',body:JSON.stringify({course:course.value,category:category.value,subject:subject.value,message:message.value})});m.textContent='Support request submitted successfully.';m.style.color='#087f68';subject.value='';message.value='';await load()}catch(x){m.textContent=x.message||'Unable to submit request.';m.style.color='#b42318'}finally{b.disabled=false;b.textContent='Submit Support Request'}});load();
</script></body></html>
