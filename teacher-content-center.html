<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Content Center | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:32px 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{padding:10px 15px;border:0;border-radius:10px;background:#e8edf7;font-weight:800;cursor:pointer}.tab.active{background:#2563eb;color:#fff}.card{background:#fff;border:1px solid #e3e8f1;border-radius:18px;padding:22px;margin:15px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #d9e0eb;border-radius:10px}button.primary{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.item{padding:14px 0;border-bottom:1px solid #e8edf4}.muted{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>📚 Teacher Content Center</h1><p class="muted">Create and organize video lessons and study resources by course and module.</p><div class="tabs"><button class="tab active" onclick="show('video',this)">Video Lesson</button><button class="tab" onclick="show('material',this)">Study Material</button></div><div class="card" id="videoPanel"><h2>Add Video Lesson</h2><input id="vt" placeholder="Lesson title"><select id="vc"><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select><input id="vm" placeholder="Module name"><input id="vu" placeholder="YouTube URL"><textarea id="vd" placeholder="Lesson description"></textarea><button class="primary" onclick="addVideo()">Publish Lesson</button></div><div class="card" id="materialPanel" style="display:none"><h2>Add Study Material</h2><input id="mt" placeholder="Resource title"><select id="mc"><option>B.Tech Mathematics</option><option>Intermediate Mathematics</option><option>Class 10 Mathematics</option><option>Classes 5–7 Mathematics</option></select><select id="mtype"><option>Chapter Notes</option><option>Formula Sheet</option><option>Important Questions</option><option>Practice Worksheet</option><option>Revision Pack</option><option>Test Preparation</option></select><input id="mu" placeholder="PDF / resource URL"><textarea id="md" placeholder="Resource description"></textarea><button class="primary" onclick="addMaterial()">Publish Material</button></div><div class="grid"><div class="card"><h2>Video Library</h2><div id="videos">Loading…</div></div><div class="card"><h2>Materials Library</h2><div id="materials">Loading…</div></div></div></div><script src="settlem-api.js"></script><script>function show(type,btn){videoPanel.style.display=type==='video'?'block':'none';materialPanel.style.display=type==='material'?'block':'none';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}async function guard(){if(!getToken()){location.href='student-login.html';return false}try{const me=await apiMe();if(!['teacher','admin'].includes(me.role))throw Error('Teacher/Admin access required');return true}catch(e){alert(e.message);return false}}async function load(){if(!await guard())return;try{const [v,m]=await Promise.all([apiAdminVideos(),apiAdminMaterials()]);videos.innerHTML=v.map(x=>`<div class="item"><b>${esc(x.title)}</b><br>${esc(x.course)} · ${esc(x.module||'')}<br><small>${esc(x.description||'')}</small></div>`).join('')||'No videos yet.';materials.innerHTML=m.map(x=>`<div class="item"><b>${esc(x.title)}</b><br>${esc(x.course)} · ${esc(x.type)}<br><small>${esc(x.description||'')}</small></div>`).join('')||'No materials yet.'}catch(e){videos.textContent=materials.textContent=e.message}}async function addVideo(){try{const u=vu.value.trim();const id=(u.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/)||[])[1]||'';if(!id)throw Error('Enter a valid YouTube URL');await apiAdminAddVideo({title:vt.value,course:vc.value,module:vm.value,youtube_url:u,video_id:id,description:vd.value});alert('Video lesson published.');vt.value=vm.value=vu.value=vd.value='';load()}catch(e){alert(e.message)}}async function addMaterial(){try{await apiAdminAddMaterial({title:mt.value,course:mc.value,type:mtype.value,url:mu.value,description:md.value});alert('Study material published.');mt.value=mu.value=md.value='';load()}catch(e){alert(e.message)}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
