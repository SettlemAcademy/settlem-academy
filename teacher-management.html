<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Management | Settlem Academy</title><style>
body{font-family:Inter,Segoe UI,Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:auto;padding:35px 20px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:22px;margin:15px 0}input{padding:12px;border:1px solid #dbe2ed;border-radius:10px;margin:5px;width:calc(33% - 18px)}button{padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.teacher{padding:14px 0;border-bottom:1px solid #e8edf4}.del{background:#dc2626;float:right}@media(max-width:700px){input{width:90%}}</style></head><body><div class="wrap"><h1>Teacher Management</h1><div class="card"><h2>Add Teacher</h2><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><button onclick="add()">Create Teacher</button><p id="msg"></p></div><div class="card"><h2>Teachers</h2><div id="list">Loading…</div></div></div><script src="settlem-api.js"></script><script>
async function load(){if(!getToken()){location.href="student-login.html";return}try{const me=await apiMe();if(me.role!=="admin")throw new Error("Admin access required");const d=await apiAdminTeachers();list.innerHTML=d.map(t=>`<div class="teacher"><b>${esc(t.name)}</b><br>${esc(t.email)} <button class="del" onclick="removeT(${t.id})">Delete</button></div>`).join("")||"No teachers yet."}catch(e){list.textContent=e.message}}
async function add(){try{await apiAdminCreateTeacher({name:name.value,email:email.value,password:password.value});msg.textContent="Teacher created.";name.value=email.value=password.value="";load()}catch(e){msg.textContent=e.message}}
async function removeT(id){if(confirm("Delete this teacher?")){await apiAdminDeleteTeacher(id);load()}}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();
</script></body></html>
