<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Portal | Settlem Academy</title><style>
body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7fb;color:#172033}.nav{background:#101a43;color:#fff;padding:18px 24px;font-weight:900}.wrap{max-width:1150px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:18px;padding:22px;box-shadow:0 10px 35px #101a4310}.num{font-size:34px;font-weight:900;color:#2563eb}.list{margin-top:18px}.item{padding:14px 0;border-bottom:1px solid #e8edf4}.muted{color:#64748b}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav">SETTLEM ACADEMY · TEACHER PORTAL</div><div class="wrap"><h1>Teacher Dashboard</h1><p class="muted">Manage learning content and view your student base.</p><div class="grid"><div class="card"><div class="num" id="students">—</div><div>Students</div></div><div class="card"><div class="num" id="videos">—</div><div>Video Lessons</div></div><div class="card"><div class="num" id="materials">—</div><div>Study Materials</div></div></div><div class="card list"><h2>Recent Students</h2><div id="studentList">Loading…</div></div></div><script src="settlem-api.js"></script><script>
async function load(){if(!getToken()){location.href="student-login.html";return}try{const d=await apiTeacherDashboard();students.textContent=d.students.length;videos.textContent=d.videos.length;materials.textContent=d.materials.length;studentList.innerHTML=d.students.slice(0,10).map(x=>`<div class="item"><b>${esc(x.name)}</b><br><span class="muted">${esc(x.email)}</span></div>`).join("")||"No students yet."}catch(e){studentList.textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();
</script><div style="position:fixed;left:18px;bottom:18px;z-index:20"><a href="teacher-content-center.html" style="display:inline-block;padding:12px 16px;border-radius:12px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 10px 30px #101a4330">Content Center</a></div><div style="position:fixed;right:18px;bottom:72px;z-index:20"><a href="analytics-dashboard.html" style="display:inline-block;padding:12px 16px;border-radius:12px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:800">Analytics</a></div><div style="position:fixed;left:18px;bottom:18px;z-index:20"><a href="announcement-manager.html" style="display:inline-block;padding:12px 16px;border-radius:12px;background:#ec4899;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 10px 30px #101a4330">Announcements</a></div></body></html>
