<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate | Settlem Academy</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f5f7ff;color:#17213f}.wrap{max-width:700px;margin:70px auto;padding:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:28px;box-shadow:0 15px 45px #17255412}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}.btn{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:18px;padding:17px;border-radius:14px;background:#f8faff}.ok{border:1px solid #86efac}.bad{border:1px solid #fecaca}</style><link rel="icon" type="image/png" href="settlem-academy-logo.png">
</head><body><main class="wrap"><div class="card"><div style="font-size:12px;font-weight:900;letter-spacing:2px;color:#7c3aed">SETTLEM ACADEMY</div><h1>Verify Certificate</h1><p>Enter a Settlem Academy Certificate ID to verify its authenticity.</p><form id="f"><input id="id" placeholder="e.g. SA-ABC123DEF456" required><button class="btn">Verify</button></form><div id="result"></div></div></main><script>const f=document.getElementById('f'),result=document.getElementById('result'),id=document.getElementById('id');const q=new URLSearchParams(location.search).get('id');if(q)id.value=q;f.onsubmit=async e=>{e.preventDefault();result.textContent='Checking…';try{const r=await fetch('https://settlem-academy-1.onrender.com/api/certificates/verify/'+encodeURIComponent(id.value.trim()));if(!r.ok)throw new Error();const d=await r.json();result.className='result ok';result.innerHTML='<strong>✓ Valid Certificate</strong><p><b>Student:</b> '+esc(d.name)+'</p><p><b>Course:</b> '+esc(d.course)+'</p><p><b>Issued:</b> '+new Date(d.issued_at).toLocaleDateString()+'</p><p><b>ID:</b> '+esc(d.certificate_id)+'</p><a href="certificate.html?id='+encodeURIComponent(d.certificate_id)+'">View Certificate</a>'}catch(x){result.className='result bad';result.textContent='Certificate not found. Please check the ID and try again.'}};function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
